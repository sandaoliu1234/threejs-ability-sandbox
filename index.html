<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>元素法术沙盒 — 程序化冰霜与雷电特效试验场</title>
    <!-- Inline, so the sandbox ships no icon file and the browser never asks for
         /favicon.ico (which would 404 on a plain static host). A four-point
         sigil matching the loading veil, on the UI's own background. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0e14'/%3E%3Cpath d='M16 5 L18.6 13.4 L27 16 L18.6 18.6 L16 27 L13.4 18.6 L5 16 L13.4 13.4 Z' fill='%238fe6ff'/%3E%3C/svg%3E"
    />
    <link rel="preload" as="fetch" href="./models/Idle.fbx" crossorigin />
    <!-- `crossorigin` to match TextureLoader, which requests anonymously. -->
    <link rel="preload" as="image" href="./models/diffuse.png" crossorigin />
    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body>
    <canvas id="viewport"></canvas>

    <!-- Boot / loading veil -->
    <div id="loader" class="loader">
      <div class="loader__inner">
        <div class="loader__sigil">
          <span class="sigil sigil--a"></span>
          <span class="sigil sigil--b"></span>
          <span class="sigil sigil--c"></span>
          <span class="sigil sigil--d"></span>
        </div>
        <h1 class="loader__title">元素法术沙盒</h1>
        <div class="loader__bar"><i id="loader-fill"></i></div>
        <p class="loader__status" id="loader-status">正在孕育冰晶…</p>
      </div>
    </div>

    <!-- Heads-up display (populated by src/ui/HUD.js) -->
    <div id="hud" class="hud" aria-live="polite"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
